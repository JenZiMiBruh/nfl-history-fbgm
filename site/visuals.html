<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How It Works</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f0d;--panel:#121915;--soft:#18211c;--line:#223029;--ink:#e8efe9;--muted:#93a39a;--accent:#2fd07a;--gold:#f5c542;--orange:#f0a93b;--blue:#5aa9ff;--red:#ff6b6b;--violet:#b48cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.panel{max-width:1100px;margin:0 auto;padding:36px 32px}
.panel + .panel{border-top:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
h2{font-family:Oswald;text-transform:uppercase;font-size:40px;margin:6px 0 6px;line-height:1.05}
.sub{color:var(--muted);font-size:16px;margin:0 0 24px;max-width:820px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
svg text{font-family:Inter}
.ax{fill:var(--muted);font-size:12px}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.big{font:700 44px Oswald;line-height:1}
.mono{font-family:'JetBrains Mono',monospace}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:stretch}
.fstep{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
.fstep .k{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.fstep .v{font:700 30px Oswald;margin:6px 0 2px}
.fstep .d{font-size:13px;color:var(--muted)}
.fstep:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:42%;color:var(--accent);font-weight:800;font-size:20px;z-index:2}
.track{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0}
.fix{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.fix .bad{border-left:4px solid var(--red);padding-left:12px}
.fix .good{border-left:4px solid var(--accent);padding-left:12px}
.fix .t{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.fix .arrow{color:var(--accent);font-size:26px;text-align:center}
.fix b{display:block;font-size:16px}
.fix small{color:var(--muted)}
.funnel{display:flex;flex-direction:column;align-items:center;gap:8px}
.fun{border-radius:14px;padding:14px 18px;text-align:center;color:#06210f;font-weight:700}
.fun span{display:block;font:700 28px Oswald;color:#06210f}
.ing{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ing div{background:var(--soft);border-radius:12px;padding:12px;font-size:13.5px;color:var(--muted)}
.ing b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const D_URL = 'data/docviz.json';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const POSC = { QB: '#2fd07a', RB: '#f0a93b', WR: '#5aa9ff', TE: '#7fd6e8', OL: '#9aa8a0', DL: '#ff6b6b', LB: '#b48cff', CB: '#f5c542', S: '#e88fd0', K: '#8fa2ff', P: '#c7b28a' };
const panel = (id, eyebrow, title, sub, body) => `<section class="panel" id="${id}"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="sub">${sub}</p>${body}</section>`;

function lineChart({ w = 1000, h = 360, xs, ys, series, xfmt = v => v, yfmt = v => v, pad = [40, 30, 40, 56], markers = () => '' }) {
  const [t, r, b, l] = pad, X = v => l + (v - xs[0]) / (xs[1] - xs[0]) * (w - l - r), Y = v => h - b - (v - ys[0]) / (ys[1] - ys[0]) * (h - t - b);
  let g = '';
  for (let i = 0; i <= 5; i++) { const v = ys[0] + (ys[1] - ys[0]) * i / 5; g += `<line x1="${l}" x2="${w - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#223029"/><text x="${l - 10}" y="${Y(v) + 4}" text-anchor="end" class="ax">${yfmt(v)}</text>`; }
  for (let i = 0; i <= 6; i++) { const v = xs[0] + (xs[1] - xs[0]) * i / 6; g += `<text x="${X(v)}" y="${h - b + 22}" text-anchor="middle" class="ax">${xfmt(v)}</text>`; }
  for (const s of series) {
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 3}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 6"' : ''} points="${s.pts.map(([x, y]) => X(x) + ',' + Y(y)).join(' ')}"/>`;
    if (s.dots) for (const [x, y] of s.pts) g += `<circle cx="${X(x)}" cy="${Y(y)}" r="4" fill="${s.color}" stroke="#0b0f0d" stroke-width="2"/>`;
    if (s.label) { const [x, y] = s.pts[s.pts.length - 1]; g += `<text x="${X(x) + 8}" y="${Y(y) + 4}" fill="${s.color}" font-size="13" font-weight="700">${esc(s.label)}</text>`; }
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}${markers(X, Y)}</svg>`;
}

async function main() {
  const D = await (await fetch(D_URL)).json();
  const curveAt = p => { const P = D.curve.points; for (let i = 1; i < P.length; i++) if (p <= P[i][0]) { const [p0, o0] = P[i - 1], [p1, o1] = P[i]; return o0 + (o1 - o0) * (p - p0) / (p1 - p0); } return 88; };
  const E = D.example;
  let html = '';

  // 1. Two questions
  html += panel('two', 'Ratings · the idea', 'Two questions for every player',
    'Football has no single stat that works for every position, and a 1972 quarterback can\'t be judged by 2020 numbers. So every player-season is rated by answering two separate questions, then making the answers agree.',
    `<div class="grid2">
      <div class="card" style="border-top:5px solid var(--accent)"><div class="eyebrow">Question 1</div><div class="big" style="margin:8px 0">How good was he?</div>
        <p class="sub" style="margin:0 0 14px">Sets his <b style="color:var(--ink)">overall rating</b>.</p>
        <div class="track"><span class="pill" style="background:#1f3a2a">AV per game</span><span class="muted">Pro-Football-Reference's Approximate Value: one number for every position, every season since 1960</span>
        <span class="pill" style="background:#1f3a2a">Rank</span><span class="muted">against everyone at his position that season</span>
        <span class="pill" style="background:#1f3a2a">Smooth</span><span class="muted">with the seasons around it, so one fluke year doesn't swing a career</span>
        <span class="pill" style="background:#1f3a2a">Honor floors</span><span class="muted">MVP, Player of the Year, All-Pro and Pro Bowl set minimums</span></div></div>
      <div class="card" style="border-top:5px solid var(--blue)"><div class="eyebrow" style="color:var(--blue)">Question 2</div><div class="big" style="margin:8px 0">What kind of player?</div>
        <p class="sub" style="margin:0 0 14px">Sets his <b style="color:var(--ink)">skill mix</b>: speed, hands, accuracy, pass rush…</p>
        <div class="track"><span class="pill" style="background:#1d2c40">His stats</span><span class="muted">yards per carry, catch rate, completion %, sacks, interceptions…</span>
        <span class="pill" style="background:#1d2c40">vs his era</span><span class="muted">compared with his own position and season, never with today</span>
        <span class="pill" style="background:#1d2c40">Z-scores</span><span class="muted">9 rating points for every standard deviation above or below average</span>
        <span class="pill" style="background:#1d2c40">Real body</span><span class="muted">real height, and strength from real weight</span></div></div>
    </div>
    <div class="card" style="margin-top:16px;text-align:center;font-size:17px">Then the skills shift <b>together</b> until Football GM's own overall formula lands exactly on Question 1's answer. <span style="color:var(--muted)">The level comes from how good he was; the shape comes from how he did it.</span></div>`);

  // 2. Curve
  html += panel('curve', 'Ratings · step 1', 'From rank to rating',
    'A player\'s rank among his position that season (his percentile) maps to an overall through this curve. It\'s steep at the top, so a great season stands apart from a good one, and nobody reaches 99. Honors set a minimum: an MVP season can\'t rate below the 99.8th percentile.',
    `<div class="card">${lineChart({ xs: [0, 1], ys: [25, 90], xfmt: v => Math.round(v * 100) + '%', series: [{ pts: Array.from({ length: 101 }, (_, i) => [i / 100, curveAt(i / 100)]), color: '#2fd07a', width: 4 }],
      markers: (X, Y) => D.curve.floors.map(([n, p], i) => `<circle cx="${X(p)}" cy="${Y(curveAt(p))}" r="6" fill="#f5c542" stroke="#0b0f0d" stroke-width="2"/><line x1="${X(p)}" y1="${Y(curveAt(p))}" x2="${X(p) - 330 + i * 0}" y2="${70 + i * 34}" stroke="#f5c54266"/><text x="${X(p) - 336}" y="${74 + i * 34}" text-anchor="end" fill="#f5c542" font-size="13" font-weight="700">${n} → at least ${Math.round(curveAt(p))}</text>`).join('')
        + [[0.5, 'Median starter'], [0.9, 'Top 10%']].map(([p, n]) => `<circle cx="${X(p)}" cy="${Y(curveAt(p))}" r="5" fill="#2fd07a"/><text x="${X(p) + 10}" y="${Y(curveAt(p)) + 18}" class="lbl">${n}: ${Math.round(curveAt(p))}</text>`).join('') })}
      <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:4px"><span>Percentile within position and season →</span><span>↑ Overall rating</span></div></div>`);

  // 3. Worked example
  const zbar = (label, z, stat) => `<div style="display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:10px 0"><span class="lbl">${label}</span><div style="position:relative;height:22px;background:var(--soft);border-radius:11px"><div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:#93a39a66"></div><div style="position:absolute;left:50%;top:3px;height:16px;width:${Math.min(48, Math.abs(z) * 14)}%;${z < 0 ? 'transform:translateX(-100%);' : ''}background:var(--blue);border-radius:8px"></div></div><span class="mono" style="color:var(--blue)">${z >= 0 ? '+' : ''}${z.toFixed(1)}σ</span></div><div style="margin:-6px 0 4px 160px;font-size:12.5px;color:var(--muted)">${stat}</div>`;
  const rbar = (k, v, c) => `<div style="display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:7px 0"><span style="color:var(--muted);font-size:13px">${k}</span><div style="height:12px;background:var(--soft);border-radius:6px"><div style="height:12px;width:${v}%;background:${c};border-radius:6px"></div></div><b class="mono">${v}</b></div>`;
  html += panel('example', 'Ratings · worked example', `${E.name}, ${E.season}`,
    `${E.stats.rusYds.toLocaleString()} rushing yards, co-MVP. Here's exactly how that season became a Football GM player, using the real numbers.`,
    `<div class="flow">
      <div class="fstep"><div class="k">AV per game</div><div class="v">${E.avpg.toFixed(2)}</div><div class="d">${E.av} AV in ${E.gp} games</div></div>
      <div class="fstep"><div class="k">Rank among RBs</div><div class="v">${(E.pct * 100).toFixed(1)}%</div><div class="d">better than ${Math.round(E.pct * E.rbCount)} of ${E.rbCount} backs in ${E.season}</div></div>
      <div class="fstep"><div class="k">MVP floor</div><div class="v">${(E.floor * 100).toFixed(1)}%</div><div class="d">his co-MVP lifts him to the floor</div></div>
      <div class="fstep"><div class="k">Curve</div><div class="v">${E.ovr}</div><div class="d">overall, among the very best that year</div></div>
      <div class="fstep" style="border-color:var(--accent)"><div class="k">Final</div><div class="v" style="color:var(--accent)">${E.ovr} OVR</div><div class="d">RB, ${E.team}</div></div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="card"><div class="eyebrow" style="color:var(--blue)">His stats against ${E.season}'s running backs</div>
        ${zbar('Yards per carry', E.z.ypc, `${E.stats.ypc.toFixed(1)} vs a typical ${E.league.ypc.toFixed(1)}`)}
        ${zbar('Yards per game', E.z.rpg, `${E.stats.rpg.toFixed(0)} vs a typical ${E.league.rpg.toFixed(0)}`)}
        ${zbar('TDs per carry', E.z.td, `${E.stats.rusTD} TDs on ${E.stats.rus} carries`)}
        <p style="color:var(--muted);font-size:13.5px;margin:12px 0 0">Yards per carry and per game drive a back's <b style="color:var(--ink)">speed</b> and <b style="color:var(--ink)">elusiveness</b>; touchdown rate drives <b style="color:var(--ink)">strength</b>; catches drive <b style="color:var(--ink)">hands</b> and <b style="color:var(--ink)">routes</b>.</p></div>
      <div class="card"><div class="eyebrow">The Football GM player that came out</div>
        ${rbar('Speed', E.ratings.spd, '#2fd07a')}${rbar('Elusiveness', E.ratings.elu, '#2fd07a')}${rbar('Ball security', E.ratings.bsc, '#5aa9ff')}${rbar('Strength', E.ratings.stre, '#5aa9ff')}${rbar('Hands', E.ratings.hnd, '#93a39a')}${rbar('Route running', E.ratings.rtr, '#93a39a')}${rbar('Pass blocking', E.ratings.pbk, '#93a39a')}${rbar('Height', E.ratings.hgt, '#93a39a')}
        <p style="color:var(--muted);font-size:13.5px;margin:12px 0 0">Elite speed, average hands, small: exactly the player he was. Height ${E.ratings.hgt} is his real 5'8".</p></div>
    </div>`);

  // 4. Distribution
  const posOrder = ['QB', 'RB', 'WR', 'TE', 'OL', 'DL', 'LB', 'CB', 'S'];
  const W = 1000, H = 380, l = 60, b = 40, t = 20, r = 20, Y = v => H - b - (v - 25) / (95 - 25) * (H - t - b);
  let dots = '';
  for (let i = 0; i <= 7; i++) { const v = 25 + i * 10; dots += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#223029"/><text x="${l - 10}" y="${Y(v) + 4}" text-anchor="end" class="ax">${v}</text>`; }
  posOrder.forEach((pos, i) => {
    const cx = l + (i + 0.5) * (W - l - r) / posOrder.length, arr = D.dist[pos] || [];
    arr.forEach((v, j) => { const jit = ((j * 37) % 23 - 11) * 3.2; dots += `<circle cx="${cx + jit}" cy="${Y(v) + ((j * 13) % 7 - 3) * 0.6}" r="3" fill="${POSC[pos]}" opacity="${j < 3 ? 1 : 0.45}"/>`; });
    dots += `<text x="${cx}" y="${H - b + 24}" text-anchor="middle" class="lbl">${pos}</text>`;
    if (arr[0]) dots += `<text x="${cx}" y="${Y(arr[0]) - 10}" text-anchor="middle" fill="${POSC[pos]}" font-size="12" font-weight="700">${arr[0]}</text>`;
  });
  html += panel('dist', 'Ratings · the result', 'Every player of 2025, rated',
    'Each dot is one player who played in 2025. Most of the league sits in the 40s and 50s, starters in the 60s, and only a handful of stars reach the 80s, like Football GM\'s own leagues. That spread is what makes a star feel like a star in the sim.',
    `<div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%">${dots}</svg></div>`);

  // 5. Careers
  const cols = ['#2fd07a', '#5aa9ff', '#f0a93b', '#ff6b6b', '#b48cff', '#f5c542'];
  html += panel('careers', 'Ratings · careers', 'Careers, season by season',
    'Because every season is rated on its own, ratings tell each career\'s real story: Brady\'s slow start and two-decade peak, Rice\'s longevity, Mahomes arriving at the top.',
    `<div class="card">${lineChart({ xs: [1, 24], ys: [40, 90], xfmt: v => 'Year ' + Math.round(v), series: D.careers.map((c, i) => ({ pts: c.pts.map(([s, o], j) => [j + 1, o]), color: cols[i], width: 3, label: c.name })), pad: [30, 150, 40, 56] })}</div>`);

  // 6. Sources timeline
  const SRC = [['nflverse', 1999, 2026, '#2fd07a', 'Rosters 1966–2026; stats from 1999; games, live season'], ['Pro-Football-Reference (Internet Archive)', 1966, 1998, '#5aa9ff', 'Season stats, rosters, Approximate Value'], ['Approximate Value', 1966, 2025, '#7fd6e8', 'The "how good" number for every player-season'],
    ['Wikipedia', 1966, 2026, '#b48cff', 'Awards, All-Pro, Pro Bowl, drafts, Hall of Fame, events'], ['Logopedia · Wikimedia', 1966, 2026, '#f5c542', '146 era logos, high resolution'], ['Real schedules', 1978, 2026, '#f0a93b', 'Every game, in order'],
    ['OverTheCap', 2000, 2026, '#c7b28a', 'Real contracts'], ['Wikidata', 1966, 2026, '#e88fd0', '2,229 dates of death, player photos'], ['ESPN', 2022, 2026, '#ff6b6b', 'College rosters, recruiting, draft board']];
  const tX = y => 370 + (y - 1966) / (2027 - 1966) * 610;
  let tl = '';
  for (const y of [1966, 1978, 1990, 2000, 2010, 2020, 2026]) tl += `<line x1="${tX(y)}" x2="${tX(y)}" y1="10" y2="${SRC.length * 46 + 10}" stroke="#223029"/><text x="${tX(y)}" y="${SRC.length * 46 + 30}" text-anchor="middle" class="ax">${y}</text>`;
  SRC.forEach(([n, a, z, c, d], i) => { const y = 20 + i * 46; tl += `<text x="355" y="${y + 12}" text-anchor="end" class="lbl">${esc(n)}</text><rect x="${tX(a)}" y="${y}" width="${tX(z + 1) - tX(a)}" height="18" rx="9" fill="${c}" opacity=".85"/><text x="355" y="${y + 30}" text-anchor="end" class="ax">${esc(d)}</text>`; });
  html += panel('sources', 'Sources', 'Where every number comes from',
    'No single source covers 60 years of football, so every player is stitched together from several. Each bar is the years a source covers.',
    `<div class="card"><svg viewBox="0 0 1000 ${SRC.length * 46 + 40}" width="100%">${tl}</svg></div>`);

  // 7. Era calibration
  html += panel('eras', 'Calibration', 'Making 1972 play like 1972',
    'Football GM\'s sim is tuned for today. Each season, the league file sets the sim\'s dials to match that era. Above 1.0 means more than the modern default, below means less. 1960s quarterbacks threw interceptions at nearly twice today\'s rate, and completed far fewer passes.',
    `<div class="card">${lineChart({ xs: [1966, 2026], ys: [0.6, 2.0], yfmt: v => '×' + v.toFixed(1), series: [
      { pts: D.eras.map(e => [e[0], e[2]]), color: '#ff6b6b', label: 'Interceptions' }, { pts: D.eras.map(e => [e[0], e[4]]), color: '#b48cff', label: 'Sacks' },
      { pts: D.eras.map(e => [e[0], e[1]]), color: '#2fd07a', label: 'Completions' }, { pts: D.eras.map(e => [e[0], e[3]]), color: '#f0a93b', label: 'Yds per carry' },
      { pts: [[1966, 1], [2026, 1]], color: '#93a39a', dash: true, width: 1.5 }], pad: [30, 130, 40, 60] })}</div>
    <div class="grid3" style="margin-top:16px">${[['cmp', 'Completion %', 100, 1], ['int', 'Interception %', 100, 2], ['ypc', 'Yards per carry', 1, 2]].map(([k, n, mul, dp]) => {
      const decs = Object.keys(D.decades).sort();
      const rows = decs.map(d => `<div style="display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;font-size:13px;margin:3px 0"><span style="color:var(--muted)">${d}s</span><span class="mono" style="color:#2fd07a">${(D.decades[d].sim[k] * mul).toFixed(dp)}</span><span class="mono" style="color:var(--muted)">${(D.decades[d].real[k] * mul).toFixed(dp)}</span></div>`).join('');
      return `<div class="card"><b>${n}</b><div style="display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;font-size:11px;color:var(--muted);margin:8px 0 4px;letter-spacing:1px"><span></span><span>SIM</span><span>REAL</span></div>${rows}</div>`; }).join('')}</div>`);

  // 8. Data fixes
  const FIX = [['Name typo made a fake player', '"Vincent Testacerde", backup QB, Cardinals', 'Merged into Vinny Testaverde, one career, one set of stats'],
    ['Two men under one name', 'Two different Reggie Whites sharing awards', 'Split by team and season; awards go to the right one'],
    ['Starter sitting in free agency', 'Pat Surtain II listed as "Patrick Surtain", unsigned', 'Matched through nicknames and suffixes: back on the Broncos'],
    ['Deceased players left active', '4 deaths recorded; Khyree Jackson signable', '2,229 deaths from Wikidata; no deceased player can be signed'],
    ['Co-MVPs missing', '1997 and 2003 MVPs list one winner', 'Barry Sanders and Steve McNair get their shared MVPs'],
    ['See-through logos', 'Outline Rams heads and Oilers helmets showed the background', 'Filled solid white at high resolution, clean edges']];
  html += panel('fixes', 'Fixing the data', 'Stat heads will notice',
    'Combining sources means combining their mistakes. Real examples of what was wrong, and how it was fixed.',
    FIX.map(([t, a, b]) => `<div class="fix"><div class="bad"><div class="t">${esc(t)}</div><b>${esc(a)}</b><small>before</small></div><div class="arrow">→</div><div class="good"><div class="t">fixed</div><b>${esc(b)}</b><small>after</small></div></div>`).join(''));

  // 9. Draft funnel
  const F = D.funnel;
  html += panel('funnel', 'Draft classes', 'From every college roster to three real drafts',
    'The 2027–2029 classes start from every FBS roster and narrow to 340 real players per draft, the same way scouts' + "'" + ' boards do.',
    `<div class="grid2"><div class="funnel">
      <div class="fun" style="width:100%;background:#2fd07a"><span>${F.rosters.toLocaleString()}</span>players on ${F.teams} FBS rosters</div>
      <div class="fun" style="width:88%;background:#5fdc98"><span>${F.statLines.toLocaleString()}</span>college stat lines, two seasons</div>
      <div class="fun" style="width:76%;background:#8fe6b6"><span>${F.recruits.toLocaleString()}</span>recruiting grades (2022–2026)</div>
      <div class="fun" style="width:62%;background:#bff0d4"><span>${F.byClass[2027].toLocaleString()} · ${F.byClass[2028].toLocaleString()} · ${F.byClass[2029].toLocaleString()}</span>eligible for 2027 · 2028 · 2029</div>
      <div class="fun" style="width:46%;background:#f5c542"><span>3 × ${F.perClass}</span>real draft classes</div></div>
      <div class="card"><b style="font-size:18px">What decides the order</b>
        <div class="ing" style="grid-template-columns:1fr 1fr">
          <div><b>College production</b>Yards, touchdowns, efficiency, tackles, sacks, picks. This season counts 60%</div>
          <div><b>Recruiting pedigree</b>ESPN's high-school grade; elite recruits also get more upside</div>
          <div><b>Playing time</b>Games played; the main signal for linemen</div>
          <div><b>Conference</b>SEC, Big Ten, ACC, Big 12 and Notre Dame count more</div>
          <div><b>Real position history</b>The 3rd-best QB goes where 3rd QBs have really gone</div>
          <div><b>ESPN big board</b>Sets the top ${F.board} of 2027 outright</div>
        </div></div></div>`);

  $('#root').innerHTML = html;
  const only = new URLSearchParams(location.search).get('only');
  if (only) document.querySelectorAll('.panel').forEach(p => { if (p.id !== only) p.remove(); });
}
main();
</script>
