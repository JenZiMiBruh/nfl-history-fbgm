<!doctype html>
<!-- GitHub banner (1280x640): a locker-room wall of every real uniform era, oldest to newest. Rendered by capture_all.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#05100a;font-family:Inter,sans-serif}
.stage{position:absolute;inset:0;perspective:1400px}
.wall{position:absolute;left:380px;top:-120px;width:1180px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px 12px;
  transform:rotateY(-24deg) rotateX(6deg) rotateZ(-4deg);transform-origin:0 50%}
.j{position:relative;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55))}
.j svg{width:100%;height:auto;display:block}
.fitz{z-index:2;transform:scale(1.35) translateZ(40px);filter:drop-shadow(0 0 18px rgba(255,255,255,.35)) drop-shadow(0 14px 16px rgba(0,0,0,.7))}
.j small{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font:600 10px Inter;color:rgba(255,255,255,.4);letter-spacing:1px}
.shade{position:absolute;inset:0;background:
  linear-gradient(90deg,#05100a 0%,#05100a 30%,rgba(5,16,10,.88) 44%,rgba(5,16,10,.25) 66%,rgba(5,16,10,0) 80%),
  linear-gradient(0deg,rgba(5,16,10,.85),transparent 22%),linear-gradient(180deg,rgba(5,16,10,.7),transparent 18%),
  radial-gradient(circle at 78% 40%,rgba(255,240,200,.12),transparent 45%)}
.copy{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:600px}
.tag{font:800 15px Inter;letter-spacing:6px;color:#7ee0a1;margin-bottom:6px}
h1{margin:0;font:700 128px/0.92 Oswald,sans-serif;color:#fff;letter-spacing:1px;text-transform:uppercase}
h1 span{display:block;background:linear-gradient(90deg,#7ee0a1,#f5c542);-webkit-background-clip:text;color:transparent}
.years{display:flex;align-items:center;gap:14px;margin:22px 0 18px;font:700 26px Oswald;color:#fff}
.years i{flex:0 0 150px;height:3px;background:linear-gradient(90deg,#7ee0a1,#f5c542);border-radius:2px}
p{margin:0;font:500 20px/1.5 Inter;color:#cfe3d5;max-width:470px}
.by{margin-top:26px;font:500 15px Inter;color:#8fb39b}.by b{color:#fff}
</style></head><body>
<div class="stage"><div class="wall" id="wall"></div></div>
<div class="shade"></div>
<div class="copy">
  <div class="tag">FOR FOOTBALL GM</div>
  <h1>NFL<span>History</span></h1>
  <div class="years">1966<i></i>TODAY</div>
  <p>Every season, every uniform. 28,700+ real players with real ratings, schedules and drafts.</p>
  <div class="by">A passion project by <b>JenZiMiBruh</b></div>
</div>
<script>
function jersey([body, numc, trim], num) {
  return `<svg viewBox="0 0 100 106">
    <defs><linearGradient id="f${num}${body.slice(1)}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient></defs>
    <path d="M30 2 L40 8 Q50 13 60 8 L70 2 L98 15 L90 41 L79 37 L79 104 L21 104 L21 37 L10 41 L2 15 Z" fill="${body}" stroke="rgba(0,0,0,.35)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M2 15 L30 2 M70 2 L98 15" stroke="${trim}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M90 41 L79 37 M10 41 L21 37" stroke="${trim}" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 8 Q50 13 60 8" stroke="${trim}" stroke-width="3" fill="none"/>
    <text x="50" y="80" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="42" fill="${numc}" stroke="${trim}" stroke-width="1.4" paint-order="stroke">${num}</text>
    <path d="M30 2 L40 8 Q50 13 60 8 L70 2 L98 15 L90 41 L79 37 L79 104 L21 104 L21 37 L10 41 L2 15 Z" fill="url(#f${num}${body.slice(1)})"/>
  </svg>`;
}
(async () => {
  const looks = [];
  for (let t = 0; t < 32; t++) {
    const T = await (await fetch(`../../site/data/team-${t}.json`)).json();
    for (const l of T.looks) looks.push(l);
  }
  looks.sort((a, b) => a.from - b.from || a.abbrev.localeCompare(b.abbrev));
  // 12 columns x 7 rows, sampled evenly across the eras so it reads oldest (left) to newest (right)
  const cols = 12, rows = 7, nums = [12, 7, 32, 80, 56, 19, 34, 88, 13, 4, 22, 99, 10, 52, 87, 8, 18, 92, 81, 28, 15, 3, 74, 21];
  const per = looks.length / cols;
  let html = '', k = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const l = looks[Math.min(looks.length - 1, Math.floor(c * per + (r / rows) * per))];
    const fitz = r === 4 && c === 6; // Larry Fitzgerald, Cardinals #11, front and center
    html += fitz ? `<div class="j fitz">${jersey(["#97233F", "#FFFFFF", "#000000"], 11)}</div>` : `<div class="j">${jersey(l.colors, nums[(r * 5 + c * 7 + k++) % nums.length].toString().replace(/^11$/, "17"))}</div>`;
  }
  document.getElementById('wall').innerHTML = html;
})();
</script>
</body></html>
